server {
  listen 80;
  client_max_body_size 6m;

  location = / { return 302 /admin/; }
  location /admin/ { proxy_pass http://admin:80; proxy_set_header Host $host; }
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /uploads/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location /actuator/health { proxy_pass http://api:8080; }
}
